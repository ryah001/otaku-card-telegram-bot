name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm deployment of otaku-card-telegram-bot to Cloudflare"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: otaku-card-telegram-bot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production_deploy == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund
      - name: Check Worker JavaScript syntax
        working-directory: cloudflare-worker
        run: npm run check
      - name: Validate Cloudflare bundle
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run --outdir=/tmp/otaku-card-worker-dist
      - name: Deploy Worker to Cloudflare
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
