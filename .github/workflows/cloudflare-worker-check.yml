name: Validate Cloudflare Worker
on:
  push:
    branches: [feature/cloudflare-webhook-adapter]
  pull_request:
    branches: [main]
jobs:
  syntax-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund
      - name: Check Worker JavaScript syntax
        working-directory: cloudflare-worker
        run: npm run check
      - name: Validate Cloudflare bundle
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run --outdir=/tmp/otaku-card-worker-dist
