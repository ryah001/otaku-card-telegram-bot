name: Validate Cloudflare Worker
on:
  push:
    branches: [feature/cloudflare-webhook-adapter]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare-worker/src/index.js
      - name: Check deployment configuration
        run: |
          test -f wrangler.toml
          grep -q 'main = "cloudflare-worker/src/index.js"' wrangler.toml
