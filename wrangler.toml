name = "otaku-card-telegram-bot"
main = "cloudflare-worker/src/index.js"
compatibility_date = "2026-10-22"
workers_dev = true

# Create a KV namespace named OTakuSessions and replace the placeholder ID below
# before deploying, or configure the equivalent binding in the Cloudflare dashboard.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
